# Common security policy. Deployment addresses, quotas, TLS and the secret are appended at startup.
use-auth-secret
fingerprint
stale-nonce=600
max-allocate-lifetime=600
no-tcp-relay
no-multicast-peers
tlsv1=0
tlsv1_1=0
dtls=0
cli=0
web-admin=0
cipher-list=ECDHE+AESGCM:ECDHE+CHACHA20
log-file=stdout
simple-log
pidfile=/tmp/turnserver.pid
userdb=/var/lib/coturn/turndb
prometheus
prometheus-address=127.0.0.1
prometheus-username-labels=0

# Do not relay to local services, private networks or cloud metadata endpoints.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::-::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Loopback peers, RFC5780 and legacy STUN response amplification stay disabled by default.
