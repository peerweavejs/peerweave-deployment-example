global
    log stdout format raw daemon warning
    uid 0
    maxconn 256

defaults
    mode http
    log global
    option http-server-close
    timeout http-request 10s
    timeout connect 3s
    timeout client 1h
    timeout server 1h

frontend docker_api
    bind :2375
    acl read_method method GET HEAD
    acl discovery path_reg ^(/v[0-9]+\.[0-9]+)?/(_ping|version|info|events)$
    acl container_list path_reg ^(/v[0-9]+\.[0-9]+)?/containers/json$
    acl container_inspect path_reg ^(/v[0-9]+\.[0-9]+)?/containers/[a-zA-Z0-9_.-]+/json$
    http-request deny unless read_method
    http-request deny unless discovery or container_list or container_inspect
    default_backend docker_socket

backend docker_socket
    server docker /var/run/docker.sock
