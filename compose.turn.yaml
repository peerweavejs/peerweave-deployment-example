name: peerweave-turn

services:
  coturn:
    image: coturn/coturn:4.18.0-r0@sha256:bbefd3e1fdfdc0d58770fe01b581fd8b00d9f3a5580d00acb77cf719a6bc78e3
    network_mode: host
    restart: unless-stopped
    init: true
    user: "24001:24001"
    read_only: true
    cap_drop: [ALL]
    # The upstream turnserver binary carries this file capability, even for high ports.
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
      - /var/lib/coturn:rw,noexec,nosuid,size=16m,uid=24001,gid=24001,mode=0700
    entrypoint: [/bin/sh, /opt/peerweave-turn/entrypoint.sh]
    environment:
      TURN_REALM: ${TURN_DOMAIN:?Set TURN_DOMAIN to the TURN DNS hostname}
      TURN_LISTEN_IP: ${TURN_LISTEN_IP:-0.0.0.0}
      TURN_RELAY_IP: ${TURN_RELAY_IP:?Set TURN_RELAY_IP to an address on this host}
      TURN_PUBLIC_IP: ${TURN_PUBLIC_IP:?Set TURN_PUBLIC_IP to the public IPv4 address}
      TURN_PORT: ${TURN_PORT:-3478}
      TURN_TLS_PORT: ${TURN_TLS_PORT:-5349}
      TURN_MIN_PORT: ${TURN_MIN_PORT:-49160}
      TURN_MAX_PORT: ${TURN_MAX_PORT:-49999}
      TURN_USER_QUOTA: ${TURN_USER_QUOTA:-16}
      TURN_TOTAL_QUOTA: ${TURN_TOTAL_QUOTA:-200}
      TURN_MAX_BPS: ${TURN_MAX_BPS:-1250000}
      TURN_BPS_CAPACITY: ${TURN_BPS_CAPACITY:-50000000}
      TURN_METRICS_PORT: ${TURN_METRICS_PORT:-9641}
    volumes:
      - type: bind
        source: ./deploy/turn
        target: /opt/peerweave-turn
        read_only: true
      - type: bind
        source: ${TURN_TLS_DIR:?Set TURN_TLS_DIR to the exported certificate directory}
        target: /run/turn-tls
        read_only: true
        bind:
          create_host_path: false
    secrets: [turn_auth_secret]
    healthcheck:
      test: [CMD, /bin/sh, /opt/peerweave-turn/healthcheck.sh]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

secrets:
  turn_auth_secret:
    file: ${TURN_AUTH_SECRET_FILE:?Set TURN_AUTH_SECRET_FILE to the shared secret file}
